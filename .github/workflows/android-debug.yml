name: Android Debug APK

# Runs tests and publishes an installable debug APK as a workflow artifact for every
# branch push and PR, so demo builds can be downloaded without a release tag.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default 'tools' package no longer exists in cmdline-tools 16+; match compileSdk 34 / AGP 8.5 build-tools.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Run tests
        run: ./gradlew test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glyphbound-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
